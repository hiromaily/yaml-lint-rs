name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: Detect CI inputs
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      format: ${{ steps.paths.outputs.format }}
      clippy: ${{ steps.paths.outputs.clippy }}
      test: ${{ steps.paths.outputs.test }}
      build: ${{ steps.paths.outputs.build }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Match changed files to jobs
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: paths
        with:
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: |
            production: &production
              - '.github/workflows/ci.yml'
              - 'Cargo.{toml,lock}'
              - '{cli,core}/Cargo.toml'
              - '.cargo/config{,.toml}'
              - 'rust-toolchain{,.toml}'
              - '{cli,core}/build.rs'
              - '{cli,core}/src/**/*.rs'
            rust: &rust
              - *production
              - '{cli,core}/{tests,examples,benches}/**/*.rs'
            fixtures: &fixtures
              - 'tests/fixtures/{valid,invalid}/**/*.{yaml,yml}'
              - 'tests/fixtures/{valid,invalid}/**/.yamllint'
            format:
              - *rust
              - '{rustfmt,.rustfmt}.toml'
              - '{cli,core}/{rustfmt,.rustfmt}.toml'
            clippy:
              - *rust
              - '{clippy,.clippy}.toml'
              - '{cli,core}/{clippy,.clippy}.toml'
            test:
              - *rust
              - *fixtures
            build:
              - *production
              - *fixtures
              - '.yamllint{,.yml,.yaml}'

  # ===========================================================================
  # Lint - Check code quality
  # ===========================================================================
  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.format == 'true' || needs.changes.outputs.clippy == 'true'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        if: needs.changes.outputs.clippy == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Check formatting
        if: needs.changes.outputs.format == 'true'
        run: cargo fmt --all -- --check

      - name: Run clippy
        if: needs.changes.outputs.clippy == 'true'
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ===========================================================================
  # Test - Run all tests
  # ===========================================================================
  test:
    name: Test (ubuntu-slim)
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run tests
        run: cargo test --all --verbose

      - name: Run tests (release)
        run: cargo test --all --release

  # ===========================================================================
  # Build - Build and verify binary
  # ===========================================================================
  build:
    name: Build (ubuntu-slim)
    runs-on: ubuntu-slim
    needs: [changes, lint, test]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.build == 'true' }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Build release
        run: cargo build --release

      - name: Test binary version
        run: ./target/release/yaml-lint --version

      - name: Test binary help
        run: ./target/release/yaml-lint --help

      - name: Validate fixtures
        run: |
          echo "=== Testing valid fixtures ==="
          ./target/release/yaml-lint tests/fixtures/valid/

          echo "=== Testing invalid fixtures (should fail) ==="
          ! ./target/release/yaml-lint tests/fixtures/invalid/

  # ===========================================================================
  # Check - Fast check without full build
  # ===========================================================================
  check:
    name: Check
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-

      - name: Run cargo check
        run: cargo check --all-targets --all-features

  # ===========================================================================
  # MSRV - Minimum Supported Rust Version check
  # ===========================================================================
  msrv:
    name: MSRV (1.100)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.100
        uses: dtolnay/rust-toolchain@1.100

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-

      - name: Check MSRV
        run: cargo check --all-targets
